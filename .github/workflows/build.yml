name: Build DFS Optimization

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      # Build and run unit tests together so test failures cannot be hidden.
      - name: Build and test
        run: gradle build --stacktrace

      - name: Check jar contents
        run: |
          ls -l build/libs
          unzip -l build/libs/dfs-optimization-1.21.11-fabric.jar | grep -E "fabric.mod.json|icon.png|DfsOptimizationClient"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: dfs-optimization-1.21.11-fabric
          path: build/libs/dfs-optimization-1.21.11-fabric.jar

